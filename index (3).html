<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cesar Car Wash</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@1,700;1,800&family=Barlow:wght@500;600;700&display=swap">
<style>
:root {
  --bg: #F1FAFD;
  --sky: #C3E9F7;
  --ink: #0B2A3C;
  --ink-soft: #4B6A7C;
  --num: #0B3F63;
  --card: rgba(255, 255, 255, 0.8);
  --line: rgba(11, 42, 60, 0.14);
  --shadow: rgba(10, 111, 174, 0.38);
  --btn-hi: #2FA9E8;
  --btn-mid: #0E88CC;
  --btn-lo: #0A6FAE;
  --btn-edge: #07507F;
  --btn-glow: rgba(10, 111, 174, 0.55);
  --btn-ink: #FFFFFF;
  --sub-bg: #FFFFFF;
  --sub-edge: #B9D6E4;
  --plus: #FFD23F;
  --plus-edge: #0B2A3C;
  --bubble-hi: rgba(255, 255, 255, 0.95);
  --bubble-rim: rgba(14, 136, 204, 0.24);
  --accent: #0A6FAE;
  --tint: rgba(14, 136, 204, 0.13);
  --warn: #C77700;
  --danger: #B3261E;
  --sheet: #F8FCFE;
  --field: #FFFFFF;
  --font-display: 'Barlow Condensed', 'Arial Narrow', sans-serif;
  --font-body: 'Barlow', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #061923; --sky: #0D3C55; --ink: #E8F6FC; --ink-soft: #92B5C7; --num: #F2FBFF;
    --card: rgba(255, 255, 255, 0.06); --line: rgba(232, 246, 252, 0.16); --shadow: rgba(0, 0, 0, 0.55);
    --btn-hi: #36B0F0; --btn-mid: #1088CF; --btn-lo: #0B6EB4; --btn-edge: #07487D; --btn-glow: rgba(21, 151, 220, 0.45);
    --sub-bg: #123447; --sub-edge: #0A2433; --plus-edge: #03121A;
    --bubble-hi: rgba(232, 246, 252, 0.5); --bubble-rim: rgba(61, 184, 245, 0.3);
    --accent: #5CC3F5; --tint: rgba(54, 176, 240, 0.18); --warn: #FFC845; --danger: #FF8A80;
    --sheet: #0A2231; --field: #0F2D3F;
    color-scheme: dark;
  }
}

* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0;
  background-color: var(--bg);
  background-image: radial-gradient(120% 55% at 50% 0%, var(--sky) 0%, transparent 70%);
  background-repeat: no-repeat;
  color: var(--ink);
  font-family: var(--font-body);
  font-size: 16px;
  -webkit-tap-highlight-color: transparent;
}
img { max-width: 100%; }
[hidden] { display: none !important; }
button:focus-visible, input:focus-visible { outline: 3px solid var(--ink); outline-offset: 3px; }

.bubbles { position: fixed; inset: 0; z-index: 0; overflow: hidden; pointer-events: none; }
.bubbles span {
  position: absolute; left: var(--x); top: var(--y); width: var(--s); height: var(--s);
  border-radius: 50%; border: 1.5px solid var(--bubble-rim);
  background:
    radial-gradient(circle at 30% 28%, var(--bubble-hi) 0 12%, transparent 14%),
    radial-gradient(circle at 50% 50%, transparent 60%, var(--bubble-rim) 100%);
}

.app {
  position: relative; z-index: 1;
  width: 100%; max-width: 440px; min-height: 100%;
  margin-inline: auto;
  display: flex; flex-direction: column; gap: 28px;
  padding-block: 20px 28px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}

.brand { display: flex; align-items: center; gap: 10px; min-width: 0; }
.badge {
  flex: none; width: 46px; height: 46px; border-radius: 15px; display: grid; place-items: center; color: #fff;
  background: linear-gradient(160deg, var(--btn-hi), var(--btn-lo));
  box-shadow: 0 4px 0 var(--btn-edge);
}
.badge svg { width: 26px; height: 26px; fill: currentColor; }
.badge .hl { fill: none; stroke: var(--btn-hi); stroke-width: 1.6; stroke-linecap: round; }
.brand h1 {
  margin: 0; min-width: 0; color: var(--ink); text-transform: uppercase; letter-spacing: 0.02em;
  font: italic 800 clamp(26px, 7.4vw, 34px)/1 var(--font-display); text-wrap: balance;
}

.tile {
  appearance: none; -webkit-appearance: none; display: grid; place-items: center; cursor: pointer;
  color: var(--ink); background: var(--sub-bg); border: 2px solid var(--line); box-shadow: 0 4px 0 var(--sub-edge);
  touch-action: manipulation; -webkit-user-select: none; user-select: none;
  transition: transform 0.08s ease-out, box-shadow 0.08s ease-out, opacity 0.15s;
}
.tile:active:not(:disabled) { transform: translateY(3px); box-shadow: 0 1px 0 var(--sub-edge); }
.tile:disabled { opacity: 0.35; cursor: default; }
.tile svg { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
.hbtn { flex: none; width: 46px; height: 46px; border-radius: 15px; }
.cam-btn { margin-left: auto; }
.cam-btn svg { width: 24px; height: 24px; stroke-width: 2.4; }
.cal-ico { position: relative; display: block; width: 26px; height: 26px; border: 2.5px solid currentColor; border-radius: 7px; overflow: hidden; }
.cal-ico::before { content: ""; position: absolute; left: 0; right: 0; top: 0; height: 6px; background: currentColor; }
.cal-ico b {
  position: absolute; left: 0; right: 0; top: 6px; bottom: 0; display: grid; place-items: center;
  font: italic 800 13px/1 var(--font-display); font-variant-numeric: tabular-nums;
}

.stage { flex: 1; display: flex; flex-direction: column; justify-content: center; gap: 48px; }

.card {
  text-align: center; padding: 20px 16px 22px; border-radius: 32px;
  background: var(--card); border: 1px solid var(--line);
  box-shadow: 0 22px 40px -26px var(--shadow);
  -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px);
}
.label {
  margin: 0 0 4px; display: flex; align-items: center; justify-content: center; gap: 8px;
  color: var(--ink-soft); text-transform: uppercase; letter-spacing: 0.16em;
  font: 600 13px/1.2 var(--font-body);
}
.label .ck { display: none; width: 15px; height: 15px; fill: none; stroke: currentColor; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
.label.done { color: var(--accent); }
.label.done .ck { display: block; }
.num {
  display: inline-block; color: var(--num); letter-spacing: -0.01em;
  font: italic 800 clamp(96px, 34vw, 150px)/0.95 var(--font-display);
  font-variant-numeric: tabular-nums; will-change: transform;
}
.num[data-size="m"] { font-size: clamp(76px, 26vw, 118px); }
.num[data-size="s"] { font-size: clamp(58px, 20vw, 90px); }

.actions { display: flex; flex-direction: column; gap: 34px; }

.add-wrap { position: relative; }
.add {
  appearance: none; -webkit-appearance: none; position: relative; overflow: hidden;
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px;
  width: 100%; min-height: 156px; padding: 24px 20px 26px;
  border: 0; border-radius: 38px; cursor: pointer; color: var(--btn-ink);
  background: linear-gradient(180deg, var(--btn-hi) 0%, var(--btn-mid) 52%, var(--btn-lo) 100%);
  box-shadow: 0 12px 0 var(--btn-edge), 0 26px 32px -10px var(--btn-glow), inset 0 2px 0 rgba(255, 255, 255, 0.4);
  touch-action: manipulation; -webkit-user-select: none; user-select: none;
  transition: transform 0.09s ease-out, box-shadow 0.09s ease-out, filter 0.15s, opacity 0.15s;
}
.add::before {
  content: ""; position: absolute; left: 10px; right: 10px; top: 8px; height: 46%; pointer-events: none;
  border-radius: 30px 30px 80px 80px / 30px 30px 36px 36px;
  background: linear-gradient(180deg, rgba(255, 255, 255, 0.42), rgba(255, 255, 255, 0.04));
}
.add > * { position: relative; }
.add:active:not(:disabled) {
  transform: translateY(8px);
  box-shadow: 0 4px 0 var(--btn-edge), 0 12px 18px -8px var(--btn-glow), inset 0 2px 0 rgba(255, 255, 255, 0.3);
}
.add:disabled { cursor: not-allowed; filter: grayscale(0.7) brightness(0.88); opacity: 0.7; }
.car { width: 76px; height: auto; fill: currentColor; filter: drop-shadow(0 3px 0 rgba(7, 80, 127, 0.45)); }
.car circle { stroke: var(--btn-mid); stroke-width: 2.4; }
.add-label {
  text-transform: uppercase; letter-spacing: 0.03em; text-shadow: 0 2px 0 rgba(7, 80, 127, 0.55);
  font: italic 800 clamp(26px, 8.4vw, 34px)/1 var(--font-display);
}

.sub-row { display: flex; justify-content: flex-end; }
.sub {
  appearance: none; -webkit-appearance: none; width: 58px; height: 58px; border-radius: 50%;
  display: grid; place-items: center; cursor: pointer; color: var(--ink);
  background: var(--sub-bg); border: 2px solid var(--line); box-shadow: 0 5px 0 var(--sub-edge);
  touch-action: manipulation; -webkit-user-select: none; user-select: none;
  transition: transform 0.08s ease-out, box-shadow 0.08s ease-out, opacity 0.15s;
}
.sub svg { width: 26px; height: 26px; fill: none; stroke: currentColor; stroke-width: 3.2; stroke-linecap: round; }
.sub:active:not(:disabled) { transform: translateY(4px); box-shadow: 0 1px 0 var(--sub-edge); }
.sub:disabled { opacity: 0.4; cursor: not-allowed; }
.add:focus-visible, .sub:focus-visible { outline-offset: 5px; }

.fx { position: absolute; left: 0; right: 0; top: 0; height: 0; z-index: 3; pointer-events: none; }
.plus {
  position: absolute; top: 0; left: 50%; opacity: 0; color: var(--plus); will-change: transform, opacity;
  font: italic 800 56px/1 var(--font-display);
  -webkit-text-stroke: 3px var(--plus-edge); paint-order: stroke fill;
  text-shadow: 0 4px 10px rgba(0, 0, 0, 0.28);
}

/* Galería de fotos en la página */
.gal { display: flex; flex-direction: column; gap: 12px; }
.gal-head { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; }
.gal-head h2 { margin: 0; text-transform: uppercase; letter-spacing: 0.03em; font: italic 800 26px/1 var(--font-display); }
.gal-head span { color: var(--ink-soft); font: 600 12px/1 var(--font-body); letter-spacing: 0.06em; text-transform: uppercase; }
.gal-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
.gal-empty {
  grid-column: 1 / -1; margin: 0; padding: 22px 16px; text-align: center; border-radius: 22px;
  color: var(--ink-soft); background: var(--card); border: 1px dashed var(--line); font: 600 14px/1.4 var(--font-body);
}
.thumb {
  appearance: none; -webkit-appearance: none; position: relative; display: flex; flex-direction: column; gap: 8px; padding: 8px 8px 10px;
  text-align: left; cursor: pointer; color: var(--ink); min-width: 0;
  background: var(--card); border: 1px solid var(--line); border-radius: 22px; box-shadow: 0 5px 0 var(--sub-edge);
  touch-action: manipulation; transition: transform 0.08s ease-out, box-shadow 0.08s ease-out;
}
.thumb:active { transform: translateY(4px); box-shadow: 0 1px 0 var(--sub-edge); }
.thumb img { display: block; width: 100%; aspect-ratio: 4 / 3; object-fit: cover; border-radius: 15px; background: var(--tint); }
.thumb .t1 { display: block; padding: 0 4px; font: italic 800 20px/1.05 var(--font-display); text-transform: uppercase; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.thumb .t2 { display: block; padding: 0 4px; margin-top: -4px; color: var(--ink-soft); font: 600 12px/1.2 var(--font-body); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.thumb .n {
  position: absolute; top: 14px; right: 14px; min-width: 26px; padding: 4px 8px; border-radius: 999px; text-align: center; color: #fff;
  background: linear-gradient(180deg, var(--btn-hi), var(--btn-lo)); box-shadow: 0 2px 0 var(--btn-edge); font: 700 11px/1 var(--font-body);
}

/* Hojas (calendario, nuevo carro, detalle) */
.sheet {
  width: 100%; max-width: 480px; max-height: calc(100% - 16px); margin: auto auto 0; padding: 0;
  overflow-x: hidden; overflow-y: auto; overscroll-behavior: contain;
  color: var(--ink); background: var(--sheet);
  border: 1px solid var(--line); border-bottom-width: 0; border-radius: 30px 30px 0 0;
  box-shadow: 0 -24px 60px -24px rgba(0, 0, 0, 0.5);
}
.sheet::backdrop { background: rgba(4, 20, 30, 0.6); -webkit-backdrop-filter: blur(3px); backdrop-filter: blur(3px); }
.sheet[open] { animation: sheet-in 0.3s cubic-bezier(0.2, 0.8, 0.2, 1); }
.sheet[open]::backdrop { animation: scrim-in 0.3s ease-out; }
.sheet.closing { animation: sheet-out 0.18s ease-in forwards; }
.sheet.closing::backdrop { animation: scrim-out 0.18s ease-in forwards; }
@keyframes sheet-in { from { opacity: 0; transform: translateY(48px); } }
@keyframes sheet-out { to { opacity: 0; transform: translateY(48px); } }
@keyframes scrim-in { from { opacity: 0; } }
@keyframes scrim-out { to { opacity: 0; } }

.sheet-head {
  position: sticky; top: 0; z-index: 2; display: flex; align-items: center; justify-content: space-between; gap: 12px;
  padding-block: 18px 10px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  background: var(--sheet);
}
.sheet-head h2 { margin: 0; min-width: 0; text-transform: uppercase; letter-spacing: 0.02em; font: italic 800 30px/1 var(--font-display); }
.head-actions { display: flex; align-items: center; gap: 10px; flex: none; }
.nav, .x { width: 44px; height: 44px; border-radius: 14px; box-shadow: 0 3px 0 var(--sub-edge); }
.home {
  height: 40px; padding: 0 14px; border-radius: 999px; box-shadow: 0 3px 0 var(--sub-edge);
  font: 700 12px/1 var(--font-body); letter-spacing: 0.12em; text-transform: uppercase;
}

.sheet-main {
  display: flex; flex-direction: column; gap: 18px; padding-top: 6px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-bottom: calc(env(safe-area-inset-bottom, 0px) + 22px);
}
.cal { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.month-nav { display: grid; grid-template-columns: 44px minmax(0, 1fr) 44px; align-items: center; gap: 8px; }
.month-mid { min-width: 0; text-align: center; }
.month-title { margin: 0; font: italic 800 26px/1 var(--font-display); text-transform: uppercase; letter-spacing: 0.03em; }
.month-sum {
  margin: 5px 0 0; color: var(--ink-soft); text-transform: uppercase; letter-spacing: 0.06em;
  font: 600 12px/1 var(--font-body); font-variant-numeric: tabular-nums;
}
.dow, .grid { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 4px; }
.dow { margin-top: 6px; }
.dow span { padding: 6px 0; text-align: center; color: var(--ink-soft); font: 600 12px/1 var(--font-body); letter-spacing: 0.1em; }
.blank { min-height: 52px; }
.cell {
  position: relative; appearance: none; -webkit-appearance: none; min-height: 52px; padding: 5px 0 4px;
  display: flex; flex-direction: column; align-items: center; gap: 3px;
  border: 0; border-radius: 14px; background: transparent; color: var(--ink); cursor: pointer;
  touch-action: manipulation; -webkit-user-select: none; user-select: none; transition: background-color 0.12s;
}
.cell .d {
  display: grid; place-items: center; width: 28px; height: 28px; border-radius: 50%;
  font: italic 800 18px/1 var(--font-display); font-variant-numeric: tabular-nums;
}
.cell .c {
  display: flex; align-items: center; justify-content: center; gap: 3px; height: 12px; color: var(--ink); white-space: nowrap;
  font: 700 11px/1 var(--font-body); font-variant-numeric: tabular-nums;
}
.cell.done { background: var(--tint); }
.cell.done .c { color: var(--accent); }
.cell.today .d { color: #fff; background: linear-gradient(180deg, var(--btn-hi), var(--btn-lo)); box-shadow: 0 2px 0 var(--btn-edge); }
.cell.sel { box-shadow: inset 0 0 0 2px var(--accent); }
.cell:active:not(:disabled) { background: var(--tint); }
.cell:disabled { opacity: 0.32; cursor: default; }
.cell:focus-visible { outline-offset: -2px; }
.ckm { width: 9px; height: 9px; flex: none; fill: none; stroke: currentColor; stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; }
.wm { width: 6px; height: 6px; flex: none; border-radius: 50%; background: var(--warn); }

.day {
  min-width: 0; display: flex; flex-direction: column; gap: 14px; padding: 16px; border-radius: 26px;
  background: var(--card); border: 1px solid var(--line);
}
.day-top { display: flex; align-items: flex-start; justify-content: space-between; gap: 10px; }
.day-date { margin: 0; min-width: 0; color: var(--ink-soft); text-transform: uppercase; letter-spacing: 0.1em; font: 600 13px/1.3 var(--font-body); }
.tag {
  flex: none; padding: 5px 10px; border-radius: 999px; color: #fff;
  background: linear-gradient(180deg, var(--btn-hi), var(--btn-lo));
  font: 700 11px/1 var(--font-body); letter-spacing: 0.14em; text-transform: uppercase;
}
.day-total { display: flex; align-items: baseline; gap: 10px; }
.day-total strong { color: var(--num); font: italic 800 64px/0.95 var(--font-display); font-variant-numeric: tabular-nums; }
.day-total span { color: var(--ink-soft); font: 600 17px/1 var(--font-body); }
.status { display: flex; align-items: center; gap: 8px; margin: 0; color: var(--ink-soft); font: 600 14px/1.2 var(--font-body); }
.dot { width: 9px; height: 9px; flex: none; border-radius: 50%; background: var(--ink-soft); }
.dot.live { background: var(--btn-hi); box-shadow: 0 0 0 3px var(--tint); }
.dot.done { background: var(--accent); }
.dot.warn { background: var(--warn); }
.fin {
  appearance: none; -webkit-appearance: none; width: 100%; min-height: 60px; padding: 0 20px;
  border: 2px solid transparent; border-radius: 22px; cursor: pointer; color: var(--btn-ink);
  background: linear-gradient(180deg, var(--btn-hi) 0%, var(--btn-mid) 55%, var(--btn-lo) 100%);
  box-shadow: 0 6px 0 var(--btn-edge), 0 14px 22px -10px var(--btn-glow), inset 0 2px 0 rgba(255, 255, 255, 0.35);
  font: italic 800 25px/1 var(--font-display); text-transform: uppercase; letter-spacing: 0.03em; text-shadow: 0 2px 0 rgba(7, 80, 127, 0.5);
  touch-action: manipulation; -webkit-user-select: none; user-select: none;
  transition: transform 0.09s ease-out, box-shadow 0.09s ease-out, opacity 0.15s;
}
.fin:active:not(:disabled) { transform: translateY(5px); box-shadow: 0 1px 0 var(--btn-edge), 0 6px 12px -8px var(--btn-glow), inset 0 2px 0 rgba(255, 255, 255, 0.3); }
.fin.cancel { color: var(--ink); background: var(--sub-bg); border-color: var(--line); box-shadow: 0 6px 0 var(--sub-edge); text-shadow: none; }
.fin.cancel:active:not(:disabled) { box-shadow: 0 1px 0 var(--sub-edge); }
.fin:disabled { opacity: 0.4; cursor: not-allowed; }

/* Hoja de carro (nuevo / detalle) */
.pic { display: block; width: 100%; max-height: 34vh; object-fit: contain; border-radius: 22px; background: #000; }
.strip { display: flex; gap: 8px; overflow-x: auto; padding: 2px 2px 6px; }
.strip button {
  appearance: none; -webkit-appearance: none; flex: none; width: 64px; height: 64px; padding: 0; overflow: hidden; cursor: pointer;
  border: 2px solid var(--line); border-radius: 14px; background: var(--tint);
}
.strip button.on { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent); }
.strip img { display: block; width: 100%; height: 100%; object-fit: cover; }
.fld { display: flex; flex-direction: column; gap: 6px; margin: 0; }
.fld span { color: var(--ink-soft); text-transform: uppercase; letter-spacing: 0.1em; font: 600 12px/1 var(--font-body); }
.fld input {
  width: 100%; min-height: 54px; padding: 0 16px; border-radius: 16px; color: var(--ink); background: var(--field);
  border: 2px solid var(--line); font: 600 18px/1 var(--font-body);
}
.fld input:focus { border-color: var(--accent); outline: none; }
.info { display: flex; flex-direction: column; gap: 10px; padding: 14px 16px; border-radius: 22px; background: var(--card); border: 1px solid var(--line); }
.info div { display: flex; flex-direction: column; gap: 3px; min-width: 0; }
.info small { color: var(--ink-soft); text-transform: uppercase; letter-spacing: 0.1em; font: 600 11px/1 var(--font-body); }
.info b { overflow-wrap: anywhere; font: italic 800 26px/1.05 var(--font-display); text-transform: uppercase; }
.info b.none { color: var(--ink-soft); font: 600 15px/1.2 var(--font-body); text-transform: none; font-style: normal; }
.info time { color: var(--ink-soft); font: 600 12px/1.2 var(--font-body); }
.pills { display: flex; flex-wrap: wrap; gap: 10px; }
.pill {
  height: 42px; padding: 0 16px; border-radius: 999px; box-shadow: 0 3px 0 var(--sub-edge);
  font: 700 13px/1 var(--font-body); letter-spacing: 0.08em; text-transform: uppercase;
}
.pill.del { color: var(--danger); margin-left: auto; }
.hist { width: 100%; height: 48px; border-radius: 16px; }
.thumb .ord {
  position: absolute; top: 14px; left: 14px; min-width: 26px; padding: 4px 8px; border-radius: 999px; text-align: center; color: var(--ink);
  background: var(--sub-bg); box-shadow: 0 2px 0 var(--sub-edge); font: 700 11px/1 var(--font-body);
}

.toast {
  position: fixed; left: 50%; bottom: calc(env(safe-area-inset-bottom, 0px) + 18px); z-index: 100; transform: translateX(-50%);
  max-width: calc(100% - 32px); padding: 12px 18px; border-radius: 999px; color: #fff; background: #0B2A3C;
  font: 600 14px/1.3 var(--font-body); text-align: center; pointer-events: none;
}

@media (min-width: 640px) {
  .sheet { max-width: 780px; margin: auto; border-radius: 30px; border-bottom-width: 1px; }
  .sheet.narrow { max-width: 480px; }
  .sheet-main.two { display: grid; grid-template-columns: minmax(0, 1.3fr) minmax(0, 1fr); gap: 18px 26px; align-items: start; }
}
@media (max-height: 560px) {
  .cell, .blank { min-height: 44px; }
  .day-total strong { font-size: 52px; }
}
@media (prefers-reduced-motion: reduce) {
  .add, .sub, .tile, .fin, .thumb { transition: none; }
  .sheet[open], .sheet[open]::backdrop { animation: none; }
}
</style>
</head>
<body>

<div class="bubbles" aria-hidden="true">
  <span style="--s:70px;--x:-14px;--y:16%"></span>
  <span style="--s:26px;--x:78%;--y:9%"></span>
  <span style="--s:44px;--x:88%;--y:34%"></span>
  <span style="--s:18px;--x:12%;--y:44%"></span>
  <span style="--s:58px;--x:-18px;--y:70%"></span>
  <span style="--s:30px;--x:84%;--y:78%"></span>
  <span style="--s:16px;--x:46%;--y:92%"></span>
</div>

<div class="app">
  <header class="brand">
    <span class="badge">
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path d="M12 2.6c3.7 4.4 6.1 7.5 6.1 10.7a6.1 6.1 0 0 1-12.2 0c0-3.2 2.4-6.3 6.1-10.7z"/>
        <path class="hl" d="M9.2 14.2a3 3 0 0 0 2.2 2.6"/>
      </svg>
    </span>
    <h1>Cesar Car Wash</h1>
    <button class="tile hbtn cam-btn" id="camBtn" type="button" aria-label="Tomar foto del carro">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 8h3l1.6-2.5h6.8L17 8h3a1 1 0 0 1 1 1v9a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V9a1 1 0 0 1 1-1z"/><circle cx="12" cy="13.5" r="3.6"/></svg>
    </button>
    <button class="tile hbtn" id="openCal" type="button" aria-haspopup="dialog" aria-label="Abrir calendario">
      <span class="cal-ico" aria-hidden="true"><b id="calDay">1</b></span>
    </button>
  </header>

  <main class="stage">
    <section class="card" aria-labelledby="lbl">
      <p class="label" id="lbl">
        <svg class="ck" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>
        <span id="lblText">Total de carros</span>
      </p>
      <div class="num" id="count" role="status" aria-live="polite" data-size="l">0</div>
    </section>

    <div class="actions">
      <div class="add-wrap">
        <button class="add" id="add" type="button">
          <svg class="car" viewBox="0 0 64 32" aria-hidden="true">
            <path fill-rule="evenodd" d="M13 14 L19 5 H41 L50 14 Z M17.5 12.5 L21 7 H29 V12.5 Z M32 7 H39 L44.5 12.5 H32 Z"/>
            <rect x="3" y="13" width="58" height="11" rx="5.5"/>
            <circle cx="17" cy="25" r="5.2"/>
            <circle cx="47" cy="25" r="5.2"/>
          </svg>
          <span class="add-label">Contador de carros</span>
        </button>
        <div class="fx" id="fx" aria-hidden="true"></div>
      </div>

      <div class="sub-row">
        <button class="sub" id="sub" type="button" aria-label="Restar un carro">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14"/></svg>
        </button>
      </div>
    </div>
  </main>

  <section class="gal" aria-labelledby="galTitle">
    <div class="gal-head"><h2 id="galTitle">Fotos de carros</h2><span id="galCount"></span></div>
    <div class="gal-grid" id="galGrid"></div>
  </section>
</div>

<input type="file" id="camInput" accept="image/*" capture="environment" hidden>
<input type="file" id="camInput2" accept="image/*" capture="environment" hidden>

<!-- Calendario -->
<dialog class="sheet" id="sheet" aria-labelledby="sheetTitle">
  <header class="sheet-head">
    <h2 id="sheetTitle">Calendario</h2>
    <div class="head-actions">
      <button class="tile home" id="homeBtn" type="button" hidden>Hoy</button>
      <button class="tile x" id="closeCal" type="button" aria-label="Cerrar calendario">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
      </button>
    </div>
  </header>

  <div class="sheet-main two">
    <div class="cal">
      <div class="month-nav">
        <button class="tile nav" id="prevM" type="button" aria-label="Mes anterior"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg></button>
        <div class="month-mid">
          <p class="month-title" id="monthTitle" aria-live="polite">Mes</p>
          <p class="month-sum" id="monthSum"></p>
        </div>
        <button class="tile nav" id="nextM" type="button" aria-label="Mes siguiente"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 5l7 7-7 7"/></svg></button>
      </div>
      <div class="dow" aria-hidden="true"><span>D</span><span>L</span><span>M</span><span>M</span><span>J</span><span>V</span><span>S</span></div>
      <div class="grid" id="grid"></div>
    </div>

    <section class="day" aria-live="polite">
      <div class="day-top">
        <p class="day-date" id="dayDate">Hoy</p>
        <span class="tag" id="todayTag">Hoy</span>
      </div>
      <div class="day-total"><strong id="dayNum">0</strong><span id="dayUnit">carros</span></div>
      <p class="status"><span class="dot" id="dot"></span><span id="statusText"></span></p>
      <button class="tile pill hist" id="histBtn" type="button">Historial (0)</button>
      <button class="fin" id="finBtn" type="button">Finalizar día</button>
    </section>
  </div>
</dialog>

<!-- Foto nueva -->
<dialog class="sheet narrow" id="newSheet" aria-labelledby="newTitle">
  <header class="sheet-head">
    <h2 id="newTitle">Nuevo carro</h2>
    <button class="tile x" id="newClose" type="button" aria-label="Cancelar">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
    </button>
  </header>
  <div class="sheet-main">
    <img class="pic" id="newPic" alt="Foto del carro">
    <label class="fld"><span>Número (opcional)</span><input id="newNum" type="text" maxlength="30" autocomplete="off" placeholder="Número de cliente"></label>
    <label class="fld"><span>Cliente (opcional)</span><input id="newClient" type="text" maxlength="60" autocomplete="off" placeholder="Nombre del cliente"></label>
    <button class="fin" id="newOk" type="button">Confirmar</button>
  </div>
</dialog>

<!-- Historial del día -->
<dialog class="sheet narrow" id="histSheet" aria-labelledby="histTitle">
  <header class="sheet-head">
    <h2 id="histTitle">Historial</h2>
    <button class="tile x" id="histClose" type="button" aria-label="Cerrar historial">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
    </button>
  </header>
  <div class="sheet-main">
    <p class="day-date" id="histDate"></p>
    <div class="gal-grid" id="histGrid"></div>
  </div>
</dialog>

<!-- Detalle del carro -->
<dialog class="sheet narrow" id="carSheet" aria-labelledby="carTitle">
  <header class="sheet-head">
    <h2 id="carTitle">Carro</h2>
    <button class="tile x" id="carClose" type="button" aria-label="Cerrar">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
    </button>
  </header>
  <div class="sheet-main">
    <img class="pic" id="carPic" alt="Foto del carro">
    <div class="strip" id="carStrip" hidden></div>
    <div class="pills" id="carPills">
      <button class="tile pill" id="editBtn" type="button">Editar</button>
      <button class="tile pill" id="morePhoto" type="button">Foto 2</button>
      <button class="tile pill del" id="delBtn" type="button">Borrar</button>
    </div>
    <div class="info" id="carInfo">
      <div><small>Número</small><b id="carNum"></b></div>
      <div><small>Cliente</small><b id="carClient"></b></div>
      <time id="carTime"></time>
    </div>
    <div id="carEdit" style="display:none;flex-direction:column;gap:18px">
      <label class="fld"><span>Número (opcional)</span><input id="editNum" type="text" maxlength="30" autocomplete="off" placeholder="Número de cliente"></label>
      <label class="fld"><span>Cliente (opcional)</span><input id="editClient" type="text" maxlength="60" autocomplete="off"></label>
      <button class="fin" id="editOk" type="button">Guardar cambios</button>
    </div>
  </div>
</dialog>

<div class="toast" id="toast" hidden></div>

<script>
(() => {
  'use strict';

  const $ = (id) => document.getElementById(id);
  const num = $('count'), add = $('add'), sub = $('sub'), fx = $('fx');
  const lbl = $('lbl'), lblText = $('lblText'), calDay = $('calDay'), openCal = $('openCal');
  const sheet = $('sheet'), closeCal = $('closeCal'), homeBtn = $('homeBtn'), prevM = $('prevM'), nextM = $('nextM');
  const monthTitle = $('monthTitle'), monthSum = $('monthSum'), grid = $('grid');
  const dayDate = $('dayDate'), todayTag = $('todayTag'), dayNum = $('dayNum'), dayUnit = $('dayUnit');
  const dot = $('dot'), statusText = $('statusText'), finBtn = $('finBtn'), histBtn = $('histBtn');
  const quiet = window.matchMedia('(prefers-reduced-motion: reduce)');

  const MONTHS = ['enero', 'febrero', 'marzo', 'abril', 'mayo', 'junio', 'julio', 'agosto', 'septiembre', 'octubre', 'noviembre', 'diciembre'];
  const WEEKDAYS = ['domingo', 'lunes', 'martes', 'miércoles', 'jueves', 'viernes', 'sábado'];
  const DATE_RE = /^\d{4}-\d{2}-\d{2}$/;
  const CHECK = '<svg class="ckm" viewBox="0 0 12 12" aria-hidden="true"><path d="M2 6.5l2.6 2.6L10 3.4"/></svg>';
  const pad = (n) => String(n).padStart(2, '0');
  const ymd = (d) => d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
  const parse = (k) => new Date(+k.slice(0, 4), +k.slice(5, 7) - 1, +k.slice(8, 10));
  const cap = (s) => s.charAt(0).toUpperCase() + s.slice(1);
  const plural = (n) => n + (n === 1 ? ' carro' : ' carros');

  /* ---------- Avisos cortos ---------- */
  const toastEl = $('toast');
  let toastT = 0;
  function toast(msg) {
    toastEl.textContent = msg;
    toastEl.hidden = false;
    clearTimeout(toastT);
    toastT = setTimeout(() => { toastEl.hidden = true; }, 3200);
  }

  /* ---------- Contador: cada día guarda su total y si ya se finalizó ---------- */
  const KEY = 'cesar-car-wash-calendario';
  const OLD_KEY = 'cesar-car-wash-contador';

  const clean = (d) => {
    if (!d || typeof d !== 'object') return null;
    const n = Math.floor(Number(d.n));
    return { n: Number.isFinite(n) && n > 0 ? n : 0, done: d.done === true };
  };

  function load() {
    const days = {};
    let raw = null;
    try { raw = localStorage.getItem(KEY); } catch (e) { /* sin almacenamiento */ }
    if (raw) {
      try {
        const src = (JSON.parse(raw) || {}).days || {};
        for (const k of Object.keys(src)) {
          const c = DATE_RE.test(k) ? clean(src[k]) : null;
          if (c) days[k] = c;
        }
      } catch (e) { /* datos dañados: se empieza limpio */ }
    } else {
      try {
        const old = parseInt(localStorage.getItem(OLD_KEY), 10);
        if (Number.isFinite(old) && old > 0) days[ymd(new Date())] = { n: old, done: false };
      } catch (e) { /* nada que pasar */ }
    }
    return { days };
  }

  const state = load();
  const save = () => { try { localStorage.setItem(KEY, JSON.stringify({ v: 2, days: state.days })); } catch (e) { /* sin almacenamiento */ } };
  const ZERO = Object.freeze({ n: 0, done: false });
  const get = (k) => state.days[k] || ZERO;
  const ensure = (k) => state.days[k] || (state.days[k] = { n: 0, done: false });
  const canAct = (k) => { const d = get(k); return k <= todayK && (d.done || d.n > 0 || k === todayK); };

  let todayK = ymd(new Date());
  let selected = todayK, viewY = 0, viewM = 0;

  /* ---------- Hojas con animación ---------- */
  function openDlg(d) {
    if (typeof d.showModal === 'function') { if (!d.open) d.showModal(); }
    else d.setAttribute('open', '');
    d.scrollTop = 0;
  }
  function closeDlg(d) {
    if (!d.open || d.classList.contains('closing')) return;
    if (quiet.matches) { d.close(); return; }
    d.classList.add('closing');
    const finish = () => { d.classList.remove('closing'); if (d.open) d.close(); };
    d.addEventListener('animationend', function once(e) {
      if (e.animationName !== 'sheet-out') return;
      d.removeEventListener('animationend', once);
      finish();
    });
    setTimeout(() => { if (d.classList.contains('closing')) finish(); }, 350);
  }
  [sheet, $('newSheet'), $('carSheet'), $('histSheet')].forEach((d) => {
    d.addEventListener('cancel', (e) => { e.preventDefault(); closeDlg(d); });
    d.addEventListener('click', (e) => { if (e.target === d) closeDlg(d); });
  });

  /* ---------- Pantalla principal ---------- */
  function renderMain() {
    const d = get(todayK);
    const text = d.n.toLocaleString('es-MX');
    num.textContent = text;
    num.dataset.size = text.length <= 3 ? 'l' : text.length <= 5 ? 'm' : 's';
    add.disabled = d.done;
    sub.disabled = d.done || d.n === 0;
    lbl.classList.toggle('done', d.done);
    lblText.textContent = d.done ? 'Día finalizado' : 'Total de carros';
    calDay.textContent = String(parse(todayK).getDate());
  }

  const pulse = (peak) => {
    if (quiet.matches || !num.animate) return;
    num.animate(
      [{ transform: 'scale(1)' }, { transform: 'scale(' + peak + ')', offset: 0.35 }, { transform: 'scale(1)' }],
      { duration: 260, easing: 'ease-out' }
    );
  };

  const floatPlusOne = () => {
    const el = document.createElement('span');
    el.className = 'plus';
    el.textContent = '+1';
    el.style.left = 'calc(50% + ' + Math.round((Math.random() - 0.5) * 70) + 'px)';
    fx.appendChild(el);
    while (fx.childElementCount > 14) fx.firstElementChild.remove();
    if (!el.animate) { setTimeout(() => el.remove(), 900); return; }

    const frames = quiet.matches
      ? [
          { opacity: 0, transform: 'translate(-50%, -30px)' },
          { opacity: 1, transform: 'translate(-50%, -30px)', offset: 0.25 },
          { opacity: 0, transform: 'translate(-50%, -30px)' }
        ]
      : [
          { opacity: 0, transform: 'translate(-50%, -78px) scale(0.6)', easing: 'cubic-bezier(0.2, 0.8, 0.3, 1)' },
          { opacity: 1, transform: 'translate(-50%, -54px) scale(1.15)', offset: 0.2, easing: 'cubic-bezier(0.4, 0, 0.8, 0.6)' },
          { opacity: 0, transform: 'translate(-50%, 58px) scale(0.85)' }
        ];

    const anim = el.animate(frames, { duration: quiet.matches ? 600 : 950, easing: 'linear', fill: 'forwards' });
    anim.onfinish = () => el.remove();
  };

  // Si cambió la fecha (pasó la medianoche), el contador de hoy empieza en 0
  function syncToday() {
    const k = ymd(new Date());
    if (k === todayK) return;
    todayK = k;
    renderMain();
    if (sheet.open) renderSheet();
  }

  add.addEventListener('click', () => {
    syncToday();
    const d = ensure(todayK);
    if (d.done) return;
    d.n += 1;
    save();
    renderMain();
    if (sheet.open) renderSheet();
    pulse(1.14);
    floatPlusOne();
  });

  sub.addEventListener('click', () => {
    syncToday();
    const d = get(todayK);
    if (d.done || d.n === 0) return;
    d.n -= 1;
    save();
    renderMain();
    if (sheet.open) renderSheet();
    pulse(0.9);
  });

  /* ---------- Calendario ---------- */
  const longDate = (k) => {
    const d = parse(k);
    const year = d.getFullYear() !== parse(todayK).getFullYear() ? ' de ' + d.getFullYear() : '';
    return cap(WEEKDAYS[d.getDay()]) + ' ' + d.getDate() + ' de ' + MONTHS[d.getMonth()] + year;
  };

  function monthCells(y, m) {
    const cells = [];
    for (let i = 0; i < new Date(y, m, 1).getDay(); i++) cells.push(0);
    for (let d = 1, n = new Date(y, m + 1, 0).getDate(); d <= n; d++) cells.push(d);
    while (cells.length % 7) cells.push(0);
    return cells;
  }

  function cellHTML(day) {
    const k = viewY + '-' + pad(viewM + 1) + '-' + pad(day);
    const d = get(k), isToday = k === todayK, future = k > todayK, show = d.done || d.n > 0;
    const count = d.n > 999 ? (Math.round(d.n / 100) / 10) + 'k' : String(d.n);
    const mark = show ? (d.done ? CHECK : (k < todayK ? '<i class="wm"></i>' : '')) : '';
    const label = day + ' de ' + MONTHS[viewM] + (isToday ? ', hoy' : '') + (show ? ', ' + plural(d.n) : '') + (d.done ? ', día finalizado' : '');
    return '<button class="cell' + (isToday ? ' today' : '') + (k === selected ? ' sel' : '') + (d.done ? ' done' : '') + '" type="button" data-k="' + k + '"' +
      (future ? ' disabled' : '') + (isToday ? ' aria-current="date"' : '') + ' aria-pressed="' + (k === selected) + '" aria-label="' + label + '">' +
      '<span class="d">' + day + '</span><span class="c">' + (show ? mark + count : '') + '</span></button>';
  }

  function renderPanel() {
    const k = selected, d = get(k);
    dayDate.textContent = longDate(k);
    todayTag.hidden = k !== todayK;
    dayNum.textContent = d.n.toLocaleString('es-MX');
    dayUnit.textContent = d.n === 1 ? 'carro' : 'carros';
    let s;
    if (k > todayK) s = ['none', 'Todavía no llega este día'];
    else if (d.done) s = ['done', 'Día finalizado'];
    else if (k === todayK) s = ['live', 'Día en curso'];
    else s = d.n > 0 ? ['warn', 'Sin finalizar'] : ['none', 'Sin registros'];
    dot.className = 'dot ' + s[0];
    statusText.textContent = s[1];
    finBtn.textContent = d.done ? 'Cancelar' : 'Finalizar día';
    finBtn.classList.toggle('cancel', d.done);
    finBtn.disabled = !canAct(k);
    histBtn.textContent = 'Historial (' + dayCars(k).length + ')';
    histBtn.disabled = k > todayK;
  }

  function renderSheet() {
    const cur = parse(todayK);
    const hadFocus = grid.contains(document.activeElement) ? document.activeElement.dataset.k : null;
    monthTitle.textContent = MONTHS[viewM] + ' ' + viewY;
    let total = 0;
    const prefix = viewY + '-' + pad(viewM + 1) + '-';
    for (const k of Object.keys(state.days)) if (k.startsWith(prefix)) total += state.days[k].n;
    monthSum.textContent = total ? plural(total) + ' en el mes' : 'Sin registros';
    const atNow = viewY === cur.getFullYear() && viewM === cur.getMonth();
    nextM.disabled = viewY > cur.getFullYear() || (viewY === cur.getFullYear() && viewM >= cur.getMonth());
    if (nextM.disabled && document.activeElement === nextM) prevM.focus({ preventScroll: true });
    homeBtn.hidden = atNow;
    grid.innerHTML = monthCells(viewY, viewM).map((day) => (day ? cellHTML(day) : '<span class="blank"></span>')).join('');
    if (hadFocus) {
      const el = grid.querySelector('[data-k="' + hadFocus + '"]');
      if (el) el.focus({ preventScroll: true });
    }
    renderPanel();
  }

  function goToday() {
    const t = parse(todayK);
    viewY = t.getFullYear(); viewM = t.getMonth(); selected = todayK;
    renderSheet();
  }

  function shiftMonth(delta) {
    const t = new Date(viewY, viewM + delta, 1);
    viewY = t.getFullYear(); viewM = t.getMonth();
    const cur = parse(todayK);
    selected = viewY === cur.getFullYear() && viewM === cur.getMonth() ? todayK : viewY + '-' + pad(viewM + 1) + '-01';
    renderSheet();
  }

  openCal.addEventListener('click', () => { syncToday(); goToday(); openDlg(sheet); });
  closeCal.addEventListener('click', () => closeDlg(sheet));
  prevM.addEventListener('click', () => shiftMonth(-1));
  nextM.addEventListener('click', () => shiftMonth(1));
  homeBtn.addEventListener('click', goToday);
  grid.addEventListener('click', (e) => {
    const b = e.target.closest('button[data-k]');
    if (!b || b.disabled) return;
    selected = b.dataset.k;
    renderSheet();
  });

  finBtn.addEventListener('click', () => {
    syncToday();
    const k = selected;
    if (!canAct(k)) return;
    const d = ensure(k);
    d.done = !d.done;
    save();
    renderMain();
    renderSheet();
  });

  document.addEventListener('visibilitychange', () => { if (!document.hidden) syncToday(); });
  window.addEventListener('focus', syncToday);
  setInterval(syncToday, 20000);

  /* ---------- Fotos de carros (se guardan en este celular) ---------- */
  const DB_NAME = 'cesar-car-wash-fotos';
  let db = null;
  let cars = [];

  function openDB() {
    return new Promise((res, rej) => {
      if (!window.indexedDB) { rej(new Error('sin indexedDB')); return; }
      const r = indexedDB.open(DB_NAME, 1);
      r.onupgradeneeded = () => { r.result.createObjectStore('cars', { keyPath: 'id' }); };
      r.onsuccess = () => res(r.result);
      r.onerror = () => rej(r.error);
    });
  }
  const dbAll = () => new Promise((res, rej) => {
    const q = db.transaction('cars', 'readonly').objectStore('cars').getAll();
    q.onsuccess = () => res(q.result || []);
    q.onerror = () => rej(q.error);
  });
  const dbPut = (car) => new Promise((res, rej) => {
    if (!db) { rej(new Error('sin base')); return; }
    const tx = db.transaction('cars', 'readwrite');
    tx.objectStore('cars').put(car);
    tx.oncomplete = () => res();
    tx.onerror = () => rej(tx.error);
    tx.onabort = () => rej(tx.error);
  });
  const dbDel = (id) => new Promise((res, rej) => {
    if (!db) { rej(new Error('sin base')); return; }
    const tx = db.transaction('cars', 'readwrite');
    tx.objectStore('cars').delete(id);
    tx.oncomplete = () => res();
    tx.onerror = () => rej(tx.error);
  });

  function shrink(file, max, q) {
    return new Promise((res, rej) => {
      const url = URL.createObjectURL(file);
      const img = new Image();
      img.onload = () => {
        const s = Math.min(1, max / Math.max(img.naturalWidth, img.naturalHeight));
        const w = Math.max(1, Math.round(img.naturalWidth * s)), h = Math.max(1, Math.round(img.naturalHeight * s));
        const c = document.createElement('canvas');
        c.width = w; c.height = h;
        c.getContext('2d').drawImage(img, 0, 0, w, h);
        URL.revokeObjectURL(url);
        res(c.toDataURL('image/jpeg', q));
      };
      img.onerror = () => { URL.revokeObjectURL(url); rej(new Error('imagen')); };
      img.src = url;
    });
  }
  async function makePhoto(file) {
    return { f: await shrink(file, 1280, 0.72), t: await shrink(file, 360, 0.7) };
  }

  const el = (tag, cls, text) => {
    const n = document.createElement(tag);
    if (cls) n.className = cls;
    if (text != null) n.textContent = text;
    return n;
  };
  const carName = (c) => c.client || (c.num ? 'N° ' + c.num : 'Sin nombre');
  const fmtTime = (ts) => {
    const d = new Date(ts);
    let h = d.getHours();
    const ap = h >= 12 ? 'p. m.' : 'a. m.';
    h = h % 12 || 12;
    return d.getDate() + ' de ' + MONTHS[d.getMonth()] + ', ' + h + ':' + pad(d.getMinutes()) + ' ' + ap;
  };

  /* --- Historial por día (del 1 al último, en el orden en que se tomaron) --- */
  const histSheet = $('histSheet'), histGrid = $('histGrid'), histDate = $('histDate');
  let histKey = todayK;
  function dayCars(k) {
    return cars.filter((c) => ymd(new Date(c.ts)) === k).sort((a, b) => a.ts - b.ts);
  }
  function renderHistory() {
    histDate.textContent = longDate(histKey);
    histGrid.textContent = '';
    const list = dayCars(histKey);
    if (!list.length) {
      histGrid.appendChild(el('p', 'gal-empty', 'No hay fotos de este día.'));
      return;
    }
    list.forEach((c, i) => {
      const b = el('button', 'thumb');
      b.type = 'button';
      b.dataset.id = c.id;
      b.setAttribute('aria-label', (i + 1) + ', ' + carName(c));
      const img = el('img');
      img.alt = '';
      img.src = c.photos[0].t;
      b.appendChild(img);
      b.appendChild(el('span', 't1', carName(c)));
      if (c.client && c.num) b.appendChild(el('span', 't2', 'N° ' + c.num));
      b.appendChild(el('span', 'ord', String(i + 1)));
      if (c.photos.length > 1) b.appendChild(el('span', 'n', String(c.photos.length)));
      histGrid.appendChild(b);
    });
  }
  histBtn.addEventListener('click', () => {
    histKey = selected;
    renderHistory();
    openDlg(histSheet);
  });
  $('histClose').addEventListener('click', () => closeDlg(histSheet));
  histGrid.addEventListener('click', (e) => {
    const b = e.target.closest('button[data-id]');
    if (b) openCar(b.dataset.id);
  });

  const galGrid = $('galGrid'), galCount = $('galCount');
  function renderGallery() {
    if (sheet.open) renderPanel();
    if (histSheet.open) renderHistory();
    galGrid.textContent = '';
    galCount.textContent = cars.length ? String(cars.length) : '';
    if (!cars.length) {
      galGrid.appendChild(el('p', 'gal-empty', 'Todavía no hay fotos. Toca la cámara de arriba para agregar la primera.'));
      return;
    }
    cars.forEach((c) => {
      const b = el('button', 'thumb');
      b.type = 'button';
      b.dataset.id = c.id;
      b.setAttribute('aria-label', 'Ver ' + carName(c));
      const img = el('img');
      img.alt = '';
      img.src = c.photos[0].t;
      b.appendChild(img);
      b.appendChild(el('span', 't1', carName(c)));
      if (c.client && c.num) b.appendChild(el('span', 't2', 'N° ' + c.num));
      if (c.photos.length > 1) b.appendChild(el('span', 'n', String(c.photos.length)));
      galGrid.appendChild(b);
    });
  }
  galGrid.addEventListener('click', (e) => {
    const b = e.target.closest('button[data-id]');
    if (b) openCar(b.dataset.id);
  });

  async function startDB() {
    try {
      db = await openDB();
      cars = (await dbAll()).sort((a, b) => b.ts - a.ts);
      if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {});
    } catch (e) {
      db = null;
      toast('Este navegador no puede guardar fotos');
    }
    renderGallery();
  }

  /* --- Foto nueva --- */
  const camInput = $('camInput'), camInput2 = $('camInput2');
  const newSheet = $('newSheet'), newPic = $('newPic'), newNum = $('newNum'), newClient = $('newClient'), newOk = $('newOk');
  let pending = null;

  $('camBtn').addEventListener('click', () => { camInput.value = ''; camInput.click(); });
  camInput.addEventListener('change', async () => {
    const f = camInput.files && camInput.files[0];
    if (!f) return;
    try {
      pending = await makePhoto(f);
    } catch (e) { toast('No se pudo leer la foto'); return; }
    newPic.src = pending.f;
    newNum.value = ''; newClient.value = '';
    openDlg(newSheet);
  });
  $('newClose').addEventListener('click', () => { pending = null; closeDlg(newSheet); });
  newOk.addEventListener('click', async () => {
    if (!pending) return;
    newOk.disabled = true;
    const car = {
      id: Date.now().toString(36) + Math.random().toString(36).slice(2, 6),
      ts: Date.now(),
      num: newNum.value.trim(),
      client: newClient.value.trim(),
      photos: [pending]
    };
    try {
      await dbPut(car);
      cars.unshift(car);
      renderGallery();
      pending = null;
      closeDlg(newSheet);
      toast('Foto guardada');
    } catch (e) {
      toast('No se pudo guardar. Puede que no haya espacio');
    }
    newOk.disabled = false;
  });

  /* --- Detalle --- */
  const carSheet = $('carSheet'), carPic = $('carPic'), carStrip = $('carStrip');
  const carInfo = $('carInfo'), carNum = $('carNum'), carClient = $('carClient'), carTime = $('carTime');
  const carEdit = $('carEdit'), editNum = $('editNum'), editClient = $('editClient');
  const carPills = $('carPills'), morePhoto = $('morePhoto');
  let cur = null, idx = 0, editing = false;

  function setField(node, v) {
    node.textContent = v || 'Sin dato';
    node.classList.toggle('none', !v);
  }
  function renderCar() {
    if (!cur) return;
    $('carTitle').textContent = carName(cur);
    idx = Math.min(idx, cur.photos.length - 1);
    carPic.src = cur.photos[idx].f;
    carStrip.textContent = '';
    carStrip.hidden = cur.photos.length < 2;
    cur.photos.forEach((p, i) => {
      const b = el('button', i === idx ? 'on' : '');
      b.type = 'button';
      b.setAttribute('aria-label', 'Foto ' + (i + 1));
      const im = el('img'); im.alt = ''; im.src = p.t;
      b.appendChild(im);
      b.addEventListener('click', () => { idx = i; renderCar(); });
      carStrip.appendChild(b);
    });
    setField(carNum, cur.num);
    setField(carClient, cur.client);
    carTime.textContent = fmtTime(cur.ts);
    morePhoto.textContent = 'Foto ' + (cur.photos.length + 1);
    carInfo.hidden = editing;
    carEdit.style.display = editing ? 'flex' : 'none';
    carPills.hidden = editing;
  }
  function openCar(id) {
    const c = cars.find((x) => x.id === id);
    if (!c) return;
    cur = c; idx = 0; editing = false;
    renderCar();
    openDlg(carSheet);
  }
  $('carClose').addEventListener('click', () => closeDlg(carSheet));

  $('editBtn').addEventListener('click', () => {
    editing = true;
    editNum.value = cur.num; editClient.value = cur.client;
    renderCar();
  });
  $('editOk').addEventListener('click', async () => {
    const old = { num: cur.num, client: cur.client };
    cur.num = editNum.value.trim(); cur.client = editClient.value.trim();
    try {
      await dbPut(cur);
      editing = false;
      renderGallery(); renderCar();
      toast('Cambios guardados');
    } catch (e) {
      cur.num = old.num; cur.client = old.client;
      toast('No se pudo guardar');
    }
  });

  morePhoto.addEventListener('click', () => { camInput2.value = ''; camInput2.click(); });
  camInput2.addEventListener('change', async () => {
    const f = camInput2.files && camInput2.files[0];
    if (!f || !cur) return;
    try {
      const p = await makePhoto(f);
      cur.photos.push(p);
      try {
        await dbPut(cur);
      } catch (e) {
        cur.photos.pop();
        throw e;
      }
      idx = cur.photos.length - 1;
      renderGallery(); renderCar();
      toast('Foto ' + cur.photos.length + ' guardada');
    } catch (e) { toast('No se pudo guardar la foto'); }
  });

  $('delBtn').addEventListener('click', async () => {
    if (!cur) return;
    const what = cur.photos.length > 1 && window.confirm('¿Borrar solo esta foto? (Aceptar = solo esta, Cancelar = ver más opciones)');
    try {
      if (what) {
        cur.photos.splice(idx, 1);
        await dbPut(cur);
        idx = 0;
        renderGallery(); renderCar();
        toast('Foto borrada');
        return;
      }
      if (!window.confirm('¿Borrar este carro y todas sus fotos?')) return;
      await dbDel(cur.id);
      cars = cars.filter((c) => c.id !== cur.id);
      cur = null;
      renderGallery();
      closeDlg(carSheet);
      toast('Carro borrado');
    } catch (e) { toast('No se pudo borrar'); }
  });

  renderMain();
  renderGallery();
  startDB();
})();
</script>

</body>
</html>
